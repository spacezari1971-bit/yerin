<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뚱의 오목 대국실 - 정통 15x15 오목</title>
  <meta name="description" content="뚱의 오목 대국실 - 정통 15x15 오목 게임 및 인공지능 대전">
  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2222%22 font-size=%2222%22>👑</text></svg>">
</head>
<body>
  <!-- Background -->
  <div class="bg-container">
    <img src="assets/bg.jpg" alt="뚱의 배경화면" class="bg-image">
  </div>
  <div class="bg-overlay"></div>
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <canvas id="confettiCanvas"></canvas>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-badge">DDUNG</span>
      <span class="brand-text">뚱의 홈페이지</span>
    </a>
    <ul class="nav-menu">
      <li><a href="index.html" class="nav-link">홈으로 가기</a></li>
      <li><a href="omok.html" class="nav-link active">오목 대국실</a></li>
    </ul>
    <a href="index.html" class="nav-cta" style="text-decoration: none;">
      <span>🏠</span> 메인 홈
    </a>
  </nav>

  <!-- Omok Game Content -->
  <main class="container">
    <div class="game-container">
      <!-- Main Board Card -->
      <div class="game-board-card">
        <div class="game-header-bar">
          <a href="index.html" class="game-back-btn" style="text-decoration: none;">
            <span>←</span> 뚱의 홈으로 이동
          </a>
          <div class="turn-banner">
            <div class="turn-stone black" id="turnStoneIndicator"></div>
            <span class="turn-text" id="turnText">내 차례 (흑돌)</span>
          </div>
        </div>

        <!-- Board Canvas -->
        <div class="board-wrapper">
          <canvas id="omokCanvas"></canvas>
        </div>
      </div>

      <!-- Side Control Panel -->
      <aside class="game-side-panel">
        <div class="panel-card">
          <div class="panel-card-title">
            <span>⚙️</span> 대국 모드 선택
          </div>
          <div class="mode-selector">
            <button class="mode-btn active" data-mode="ai">🤖 AI 대전</button>
            <button class="mode-btn" data-mode="pvp">👥 2인 대전</button>
          </div>

          <div id="aiDifficultyContainer" class="ai-difficulty-selector">
            <button class="diff-btn" data-diff="easy">1단 (초급)</button>
            <button class="diff-btn" data-diff="normal">2단 (중급)</button>
            <button class="diff-btn active" data-diff="hard">3단 (고급)</button>
          </div>

          <div class="btn-group">
            <button class="ctrl-btn btn-restart" id="btnRestart">
              <span>🔄</span> 판 쓸기 (새 게임)
            </button>
            <button class="ctrl-btn btn-undo" id="btnUndo">
              <span>↩️</span> 한 수 무르기
            </button>
            <button class="ctrl-btn btn-sound sound-on" id="btnSound">
              <span>🔊</span> 착수 효과음
            </button>
          </div>
        </div>

        <div class="panel-card">
          <div class="panel-card-title">
            <span>📊</span> 나의 대국 기록실
          </div>
          <div class="game-stats-grid">
            <div class="stat-tile">
              <div class="val" id="statTotalGames">0</div>
              <div class="sub">총 게임수</div>
            </div>
            <div class="stat-tile">
              <div class="val" id="statWinRate">0%</div>
              <div class="sub">승률</div>
            </div>
            <div class="stat-tile">
              <div class="val" id="statWinLoss">0승 0패</div>
              <div class="sub">전적</div>
            </div>
            <div class="stat-tile">
              <div class="val" id="statMoveCount">0</div>
              <div class="sub">현재 착수수</div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Victory Modal -->
  <div class="modal-overlay" id="victoryModal">
    <div class="victory-modal">
      <div class="modal-trophy">🏆</div>
      <h2 class="modal-winner-title" id="modalWinnerTitle">대승리!</h2>
      <p class="modal-winner-desc" id="modalWinnerDesc">멋진 수로 승리를 쟁취하셨습니다!</p>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="ctrl-btn btn-restart" id="modalRestartBtn" style="padding: 12px 24px; width: auto;">
          <span>🔄</span> 다시 한 판
        </button>
        <button class="ctrl-btn btn-undo" id="modalCloseBtn" style="padding: 12px 20px; width: auto;">
          닫기
        </button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 뚱의 홈페이지 (Ddung's Studio) - All Rights Reserved.</p>
  </footer>

  <script src="game.js"></script>
  <script src="main.js"></script>
</body>
</html>
